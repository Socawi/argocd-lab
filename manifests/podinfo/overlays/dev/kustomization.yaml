apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base
  - sealed-secrets.yaml
replicas:
  - name: podinfo
    count: 1
images:
  - name: ghcr.io/stefanprodan/podinfo
    newTag: 6.7.1            # dev va por delante
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: podinfo
      spec:
        template:
          spec:
            containers:
              - name: podinfo
                env:
                  - name: PODINFO_UI_MESSAGE
                    value: "Entorno DEV v2"
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: podinfo
      spec:
        template:
          spec:
            containers:
              - name: podinfo
                envFrom:
                  - secretRef:
                      name: podinfo-secret
