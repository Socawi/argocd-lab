apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: argocd
  namespace: argocd
  # SIN finalizer: borrar esta app jamás debe desinstalar Argo CD
spec:
  project: default
  source:
    repoURL: https://github.com/Socawi/argocd-lab.git
    targetRevision: main
    path: argocd
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
