apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: podinfo
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  syncPolicy:
    preserveResourcesOnDeletion: true
    applicationsSync: create-update
  generators:
    - git:
        repoURL: https://github.com/Socawi/argocd-lab.git
        revision: main
        directories:
          - path: manifests/podinfo/overlays/*
  template:
    metadata:
      name: 'podinfo-{{ .path.basename }}'
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: default
      source:
        repoURL: https://github.com/Socawi/argocd-lab.git
        targetRevision: main
        path: '{{ .path.path }}'
      destination:
        server: https://kubernetes.default.svc
        namespace: 'podinfo-{{ .path.basename }}'
  templatePatch: |
    spec:
      syncPolicy:
        {{- if ne .path.basename "prod" }}
        automated:
          prune: true
          selfHeal: true
        {{- end }}
        syncOptions:
          - CreateNamespace=true
