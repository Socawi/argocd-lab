apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  resource.customizations.health.demo.socawi.io_Database: |
    hs = {}
    if obj.status ~= nil and obj.status.phase ~= nil then
      if obj.status.phase == "Ready" then
        hs.status = "Healthy"
        hs.message = "Base de datos lista"
      elseif obj.status.phase == "Failed" then
        hs.status = "Degraded"
        hs.message = obj.status.message or "Fallo"
      else
        hs.status = "Progressing"
        hs.message = "Fase: " .. obj.status.phase
      end
      return hs
    end
    hs.status = "Progressing"
    hs.message = "Esperando a que el operador reporte status"
    return hs
